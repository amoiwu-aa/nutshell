name: Bug report
description: Report a reproducible problem in Nutshell
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove passwords, private keys, hostnames, IP addresses, and tokens from all examples and logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11 / macOS / Linux
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Nutshell, Node.js, Rust, remote OS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
