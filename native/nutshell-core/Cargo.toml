[package]
name = "nutshell-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
russh = { version = "0.58", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
